<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文颜风格 Markdown 编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ui-bg: #f8f9fa;
  --ui-border: #e0e0e0;
  --ui-text: #333;
  --ui-accent: #1988FC;
  --ui-hover: #e8f0fe;
  --ui-panel-bg: #fff;
  --ui-radius: 8px;
  --ui-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--ui-bg); color: var(--ui-text); }

/* ========== LAYOUT ========== */
.app { display: flex; flex-direction: column; height: 100vh; }
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; background: var(--ui-panel-bg); border-bottom: 1px solid var(--ui-border);
  box-shadow: var(--ui-shadow); z-index: 10; flex-shrink: 0; height: 52px;
}
.header .logo { font-weight: 700; font-size: 18px; color: var(--ui-accent); white-space: nowrap; }
.header .spacer { flex: 1; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border: 1px solid var(--ui-border); border-radius: var(--ui-radius);
  background: var(--ui-panel-bg); color: var(--ui-text); font-size: 13px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { background: var(--ui-hover); border-color: var(--ui-accent); }
.btn.active { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
.btn-primary { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
.btn-primary:hover { background: #1470d1; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }

/* Theme select */
.theme-select {
  padding: 6px 10px; border: 1px solid var(--ui-border); border-radius: var(--ui-radius);
  background: var(--ui-panel-bg); font-size: 13px; cursor: pointer; outline: none;
}
.theme-select:focus { border-color: var(--ui-accent); }

/* Main content */
.main { display: flex; flex: 1; overflow: hidden; }

/* Editor pane */
.editor-pane {
  flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--ui-border);
  min-width: 0;
}
.editor-toolbar {
  display: flex; align-items: center; gap: 4px; padding: 6px 12px;
  background: #fafafa; border-bottom: 1px solid var(--ui-border); flex-shrink: 0;
}
.editor-toolbar .toolbar-btn {
  width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: #666; font-size: 14px; transition: all 0.15s;
}
.editor-toolbar .toolbar-btn:hover { background: #e8e8e8; color: #333; }
.editor-toolbar .divider { width: 1px; height: 20px; background: #ddd; margin: 0 4px; }

#editor {
  flex: 1; width: 100%; border: none; outline: none; resize: none;
  padding: 20px 24px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 14px; line-height: 1.6; color: #333; background: #fff;
  tab-size: 2;
}
#editor::placeholder { color: #bbb; }

/* Preview pane */
.preview-pane {
  flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
.preview-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: #fafafa; border-bottom: 1px solid var(--ui-border); flex-shrink: 0;
}
.preview-header span { font-size: 12px; color: #999; }

#preview-scroll {
  flex: 1; overflow-y: auto; padding: 20px 24px; background: #fff;
}

/* ========== THEME PREVIEW STYLES ========== */
#wenyan {
  max-width: 700px; margin: 0 auto;
  font-family: var(--sans-serif-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

/* ========== RIGHT PANEL: DIMENSION SWITCHER ========== */
.right-panel {
  width: 280px; background: var(--ui-panel-bg); border-left: 1px solid var(--ui-border);
  overflow-y: auto; flex-shrink: 0; display: none; transition: width 0.2s;
}
.right-panel.open { display: block; }
.panel-section { border-bottom: 1px solid #f0f0f0; }
.panel-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer; user-select: none;
  font-size: 13px; font-weight: 600; color: #555; transition: background 0.15s;
}
.panel-section-header:hover { background: #f8f8f8; }
.panel-section-header .arrow { transition: transform 0.2s; font-size: 10px; color: #999; }
.panel-section-header.collapsed .arrow { transform: rotate(-90deg); }
.panel-section-body { padding: 8px 14px 14px; }
.panel-section-header.collapsed + .panel-section-body { display: none; }

.dim-item {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.dim-item:last-child { margin-bottom: 0; }
.dim-label { font-size: 12px; color: #666; min-width: 80px; white-space: nowrap; }
.dim-select {
  flex: 1; padding: 4px 8px; border: 1px solid #e0e0e0; border-radius: 6px;
  font-size: 12px; background: #fafafa; cursor: pointer; outline: none;
}
.dim-select:focus { border-color: var(--ui-accent); }

/* ========== PREVIEW AREA: FULL THEME (when in whole-theme mode) ========== */
/* These selectors ensure the preview uses the correct theme */
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">✦ 文颜风格编辑器</div>
    <div class="spacer"></div>

    <select id="themeSelect" class="theme-select" title="整体主题切换">
      <option value="">选择主题...</option>
    </select>

    <button id="togglePanel" class="btn" title="元素风格混搭面板">
      <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      元素混搭
    </button>

    <button id="copyBtn" class="btn btn-primary" title="复制 HTML 到剪贴板">
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      复制 HTML
    </button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Editor -->
    <div class="editor-pane">
      <div class="editor-toolbar">
        <button class="toolbar-btn" data-action="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
        <button class="toolbar-btn" data-action="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button class="toolbar-btn" data-action="strikethrough" title="删除线"><s>S</s></button>
        <div class="divider"></div>
        <button class="toolbar-btn" data-action="h1" title="一级标题">H1</button>
        <button class="toolbar-btn" data-action="h2" title="二级标题">H2</button>
        <button class="toolbar-btn" data-action="h3" title="三级标题">H3</button>
        <div class="divider"></div>
        <button class="toolbar-btn" data-action="ul" title="无序列表">•</button>
        <button class="toolbar-btn" data-action="ol" title="有序列表">1.</button>
        <button class="toolbar-btn" data-action="checklist" title="清单">☑</button>
        <div class="divider"></div>
        <button class="toolbar-btn" data-action="quote" title="引用">&ldquo;</button>
        <button class="toolbar-btn" data-action="code" title="行内代码">&lt;/&gt;</button>
        <button class="toolbar-btn" data-action="codeblock" title="代码块">```</button>
        <button class="toolbar-btn" data-action="link" title="链接">🔗</button>
        <button class="toolbar-btn" data-action="image" title="图片">🖼</button>
        <button class="toolbar-btn" data-action="table" title="表格">▦</button>
        <button class="toolbar-btn" data-action="hr" title="分割线">—</button>
      </div>
      <textarea id="editor" placeholder="在此输入 Markdown 内容...&#10;&#10;支持 front matter 和标准 Markdown 语法"></textarea>
    </div>

    <!-- Preview -->
    <div class="preview-pane">
      <div class="preview-header">
        <span>预览</span>
        <span id="charCount">0 字</span>
      </div>
      <div id="preview-scroll">
        <div id="wenyan"></div>
      </div>
    </div>

    <!-- Right Panel: Dimension Switcher -->
    <div id="rightPanel" class="right-panel">
      <div id="dimPanelContent"></div>
    </div>
  </div>
</div>

<script>
// ========== STATE ==========
const state = {
  currentTheme: 'default',
  dimensions: {},  // { dimKey: themeName } — only set when overridden
  mode: 'whole',   // 'whole' or 'mix'
};

// ========== DATA (injected by build) ==========
let THEMES = {};
let DIM_CSS = {};
let MANIFEST = null;

// ========== INIT ==========
async function init() {
  // Load data
  const [themesResp, dimsResp, manifestResp] = await Promise.all([
    fetch('themes.json'),
    fetch('dimensions.json'),
    fetch('manifest.json'),
  ]);
  THEMES = await themesResp.json();
  DIM_CSS = await dimsResp.json();
  MANIFEST = await manifestResp.json();

  // Populate theme select
  const select = document.getElementById('themeSelect');
  MANIFEST.themes.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.name;
    select.appendChild(opt);
  });
  select.value = 'default';

  // Populate dimension panel
  buildDimPanel();

  // Apply initial theme
  applyTheme('default');

  // Setup events
  setupEvents();

  // Load saved state
  loadState();

  // Load sample content
  if (!document.getElementById('editor').value) {
    document.getElementById('editor').value = SAMPLE_MD;
    renderMarkdown();
  }
}

// ========== THEME APPLICATION ==========
let themeStyleEl = null;

function applyTheme(themeName) {
  state.currentTheme = themeName;

  if (!themeStyleEl) {
    themeStyleEl = document.createElement('style');
    themeStyleEl.id = 'theme-css';
    document.head.appendChild(themeStyleEl);
  }

  // In whole mode: apply full theme CSS
  if (state.mode === 'whole' && THEMES[themeName]) {
    themeStyleEl.textContent = THEMES[themeName];
  } else if (state.mode === 'mix') {
    applyMixedTheme();
  }
}

function applyMixedTheme() {
  let css = '';

  // Start with base theme (default) as fallback for un-overridden dimensions
  const baseCss = THEMES['default'] || '';

  // Parse base CSS into dimension blocks
  const baseByDim = {};
  for (const [dimKey, themeMap] of Object.entries(DIM_CSS)) {
    baseByDim[dimKey] = themeMap['default'] || '';
  }

  // For each dimension, use the override if set, otherwise use default
  for (const dim of MANIFEST.dimensions) {
    const overrideTheme = state.dimensions[dim.id];
    const sourceTheme = overrideTheme || 'default';
    const dimCss = DIM_CSS[dim.id]?.[sourceTheme] || baseByDim[dim.id] || '';
    css += dimCss + '\n';
  }

  // Add base text color and spacing from default as fallback
  if (!state.dimensions['text-color'] && !state.dimensions['spacing']) {
    // The full default theme handles this
  }

  themeStyleEl.textContent = css;
}

// ========== DIMENSION PANEL ==========
function buildDimPanel() {
  const container = document.getElementById('dimPanelContent');
  container.innerHTML = '';

  // Whole theme section
  const wholeSection = document.createElement('div');
  wholeSection.className = 'panel-section';
  wholeSection.innerHTML = `
    <div class="panel-section-header" onclick="toggleSection(this)">
      <span>🎨 整体主题</span>
      <span class="arrow">▼</span>
    </div>
    <div class="panel-section-body">
      <div class="dim-item">
        <select id="panelThemeSelect" class="dim-select" style="width:100%" onchange="switchWholeTheme(this.value)">
          ${MANIFEST.themes.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:11px;color:#999;margin-top:4px">选择主题将重置所有单独设置</div>
    </div>
  `;
  container.appendChild(wholeSection);

  // Element dimensions section
  const dimSection = document.createElement('div');
  dimSection.className = 'panel-section';
  dimSection.innerHTML = `
    <div class="panel-section-header" onclick="toggleSection(this)">
      <span>🔧 元素级风格</span>
      <span class="arrow">▼</span>
    </div>
    <div class="panel-section-body" id="dimControls"></div>
  `;
  container.appendChild(dimSection);

  const controls = document.getElementById('dimControls');
  const dimThemes = MANIFEST.themes.map(t => `<option value="">跟随整体</option>` + MANIFEST.themes.map(th => `<option value="${th.id}">${th.name}</option>`).join(''));

  MANIFEST.dimensions.forEach(dim => {
    const div = document.createElement('div');
    div.className = 'dim-item';
    div.innerHTML = `
      <span class="dim-label" title="${dim.id}">${dim.icon} ${dim.name}</span>
      <select class="dim-select" data-dim="${dim.id}" onchange="switchDimension('${dim.id}', this.value)">
        ${dimThemes.map(s => s).join('')}
      </select>
    `;
    controls.appendChild(div);
  });

  // Reset button
  const resetDiv = document.createElement('div');
  resetDiv.style.cssText = 'margin-top:12px;text-align:center';
  resetDiv.innerHTML = `<button class="btn" onclick="resetAllDimensions()" style="font-size:12px;padding:4px 12px">↺ 重置所有单独设置</button>`;
  controls.appendChild(resetDiv);
}

function toggleSection(header) {
  header.classList.toggle('collapsed');
}

// ========== DIMENSION SWITCHING ==========
function switchWholeTheme(themeName) {
  state.mode = 'whole';
  state.dimensions = {};
  applyTheme(themeName);

  // Sync UI
  document.getElementById('themeSelect').value = themeName;
  document.getElementById('panelThemeSelect').value = themeName;

  // Reset all dimension selects
  document.querySelectorAll('#dimControls .dim-select').forEach(s => s.value = '');
  saveState();
}

function switchDimension(dimId, themeName) {
  if (!themeName) {
    delete state.dimensions[dimId];
  } else {
    state.dimensions[dimId] = themeName;
  }

  // Switch to mix mode if any dimension is overridden
  const hasOverride = Object.keys(state.dimensions).length > 0;
  state.mode = hasOverride ? 'mix' : 'whole';

  if (state.mode === 'whole') {
    applyTheme(state.currentTheme);
  } else {
    applyMixedTheme();
  }
  saveState();
}

function resetAllDimensions() {
  state.dimensions = {};
  state.mode = 'whole';
  applyTheme(state.currentTheme);

  document.querySelectorAll('#dimControls .dim-select').forEach(s => s.value = '');
  saveState();
}

// ========== MARKDOWN RENDERING ==========
function renderMarkdown() {
  const editor = document.getElementById('editor');
  const preview = document.getElementById('wenyan');
  const text = editor.value;

  // Parse front matter
  let md = text;
  let frontMatter = '';
  const fmMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (fmMatch) {
    frontMatter = fmMatch[1];
    md = fmMatch[2];
  }

  // Render
  preview.innerHTML = marked.parse(md);

  // Update char count
  const count = text.replace(/\s/g, '').length;
  document.getElementById('charCount').textContent = count + ' 字';
}

// ========== TOOLBAR ACTIONS ==========
function toolbarAction(action) {
  const editor = document.getElementById('editor');
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const selected = editor.value.substring(start, end);
  const before = editor.value.substring(0, start);
  const after = editor.value.substring(end);

  let insert = '';
  let cursorOffset = 0;

  switch (action) {
    case 'bold':
      insert = `**${selected || '粗体文字'}**`;
      cursorOffset = selected ? insert.length : 2;
      break;
    case 'italic':
      insert = `*${selected || '斜体文字'}*`;
      cursorOffset = selected ? insert.length : 1;
      break;
    case 'strikethrough':
      insert = `~~${selected || '删除线'}~~`;
      cursorOffset = selected ? insert.length : 2;
      break;
    case 'h1':
      insert = `\n# ${selected || '标题'}`;
      cursorOffset = insert.length;
      break;
    case 'h2':
      insert = `\n## ${selected || '标题'}`;
      cursorOffset = insert.length;
      break;
    case 'h3':
      insert = `\n### ${selected || '标题'}`;
      cursorOffset = insert.length;
      break;
    case 'ul':
      insert = `\n- ${selected || '列表项'}`;
      cursorOffset = insert.length;
      break;
    case 'ol':
      insert = `\n1. ${selected || '列表项'}`;
      cursorOffset = insert.length;
      break;
    case 'checklist':
      insert = `\n- [ ] ${selected || '待办事项'}`;
      cursorOffset = insert.length;
      break;
    case 'quote':
      insert = `\n> ${selected || '引用文字'}`;
      cursorOffset = insert.length;
      break;
    case 'code':
      insert = `\`${selected || 'code'}\``;
      cursorOffset = selected ? insert.length : 1;
      break;
    case 'codeblock':
      insert = `\n\`\`\`\n${selected || '代码'}\n\`\`\`\n`;
      cursorOffset = selected ? insert.length : 4;
      break;
    case 'link':
      insert = `[${selected || '链接文字'}](url)`;
      cursorOffset = selected ? insert.length - 4 : 1;
      break;
    case 'image':
      insert = `![${selected || '图片描述'}](url)`;
      cursorOffset = selected ? insert.length - 4 : 2;
      break;
    case 'table':
      insert = `\n| 列1 | 列2 | 列3 |\n|------|------|------|\n| 内容 | 内容 | 内容 |\n`;
      cursorOffset = insert.length;
      break;
    case 'hr':
      insert = `\n---\n`;
      cursorOffset = insert.length;
      break;
  }

  editor.value = before + insert + after;
  editor.focus();
  editor.selectionStart = start + cursorOffset;
  editor.selectionEnd = start + cursorOffset;
  renderMarkdown();
}

// ========== COPY HTML ==========
function copyHtml() {
  const wenyan = document.getElementById('wenyan');
  const html = wenyan.innerHTML;

  // Build full styled HTML
  const themeCss = state.mode === 'whole'
    ? (THEMES[state.currentTheme] || '')
    : buildMixedCss();

  // Extract background-related props from #wenyan CSS block for inline style
  // WeChat strips <style> tags, so backgrounds must be inline to survive paste
  let bgInline = '';
  let svgDataUri = null;
  const wenyanMatch = themeCss.match(/#wenyan\s*\{([^}]*)\}/);
  if (wenyanMatch) {
    const block = wenyanMatch[1];
    const bgProps = ['background-image', 'background-size', 'background-color', 'background', 'background-repeat', 'padding'];
    for (const prop of bgProps) {
      const re = new RegExp(prop + '\\s*:\\s*([^;]+);');
      const m = block.match(re);
      if (m) {
        const val = m[1].trim();
        // Detect SVG data URI in background-image
        if (prop === 'background-image' && val.includes('data:image/svg+xml')) {
          const uriMatch = val.match(/url\("data:image\/svg\+xml,([^"]+)"\)/)
                        || val.match(/url\('data:image\/svg\+xml,([^']+)'\)/)
                        || val.match(/url\(data:image\/svg\+xml,([^)]+)\)/);
          if (uriMatch) {
            try {
              svgDataUri = decodeURIComponent(uriMatch[1]);
            } catch(e) {
              svgDataUri = uriMatch[1];
            }
          }
          // Don't put SVG background-image in inline style — we'll use inline <svg> instead
          continue;
        }
        bgInline += prop + ':' + val + ';';
      }
    }
  }

  // If SVG background detected, create inline <svg> overlay (like xhs.pro)
  let svgOverlay = '';
  if (svgDataUri) {
    svgOverlay = `<span style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;">${svgDataUri}</span>`;
  }

  const fullHtml = `<div id="wenyan" style="position:relative;max-width: 700px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.75; font-size: 16px;${bgInline}">
${svgOverlay}<style>${themeCss}</style>
${html}
</div>`;

  // Use a temporary div with the rendered HTML, then copy via selection
  // This ensures the clipboard contains rich HTML (text/html), not plain text
  const tmp = document.createElement('div');
  tmp.innerHTML = fullHtml;
  tmp.style.position = 'fixed';
  tmp.style.left = '-9999px';
  tmp.style.top = '0';
  document.body.appendChild(tmp);

  const range = document.createRange();
  range.selectNodeContents(tmp);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) { /* ignore */ }

  sel.removeAllRanges();
  document.body.removeChild(tmp);

  const btn = document.getElementById('copyBtn');
  if (ok) {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ 已复制';
    btn.classList.add('active');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.classList.remove('active');
    }, 2000);
  } else {
    // Final fallback: Clipboard API with text/html MIME
    const blob = new Blob([fullHtml], { type: 'text/html' });
    const item = new ClipboardItem({ 'text/html': blob, 'text/plain': new Blob([fullHtml], { type: 'text/plain' }) });
    navigator.clipboard.write([item]).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ 已复制';
      btn.classList.add('active');
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('active');
      }, 2000);
    });
  }
}

function buildMixedCss() {
  let css = '';
  for (const dim of MANIFEST.dimensions) {
    const sourceTheme = state.dimensions[dim.id] || 'default';
    css += (DIM_CSS[dim.id]?.[sourceTheme] || '') + '\n';
  }
  return css;
}

// ========== STATE PERSISTENCE ==========
function saveState() {
  try {
    localStorage.setItem('wenyan-editor-state', JSON.stringify({
      theme: state.currentTheme,
      dimensions: state.dimensions,
      mode: state.mode,
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('wenyan-editor-state'));
    if (saved) {
      if (saved.theme) {
        state.currentTheme = saved.theme;
        document.getElementById('themeSelect').value = saved.theme;
        document.getElementById('panelThemeSelect').value = saved.theme;
      }
      if (saved.dimensions) {
        state.dimensions = saved.dimensions;
        for (const [dimId, themeName] of Object.entries(saved.dimensions)) {
          const sel = document.querySelector(`#dimControls .dim-select[data-dim="${dimId}"]`);
          if (sel) sel.value = themeName;
        }
      }
      if (saved.mode) state.mode = saved.mode;
      applyTheme(state.currentTheme);
      if (state.mode === 'mix' && Object.keys(state.dimensions).length) {
        applyMixedTheme();
      }
    }
  } catch(e) {}
}

// ========== EVENTS ==========
function setupEvents() {
  // Editor input
  const editor = document.getElementById('editor');
  let renderTimer;
  editor.addEventListener('input', () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderMarkdown, 50);
  });

  // Tab support
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = start + 2;
    }
  });

  // Theme selector (header)
  document.getElementById('themeSelect').addEventListener('change', (e) => {
    switchWholeTheme(e.target.value);
  });

  // Toggle panel
  document.getElementById('togglePanel').addEventListener('click', () => {
    const panel = document.getElementById('rightPanel');
    panel.classList.toggle('open');
    const btn = document.getElementById('togglePanel');
    btn.classList.toggle('active');
  });

  // Copy button
  document.getElementById('copyBtn').addEventListener('click', copyHtml);

  // Toolbar buttons
  document.querySelectorAll('.toolbar-btn').forEach(btn => {
    btn.addEventListener('click', () => toolbarAction(btn.dataset.action));
  });

  // Keyboard shortcuts
  editor.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
      e.preventDefault();
      toolbarAction('bold');
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
      e.preventDefault();
      toolbarAction('italic');
    }
  });
}
